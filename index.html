  <body>
    <div id="root"></div>
    <!-- Language bootstrap. Resolves the active locale from localStorage (or the
         browser) and writes lang/dir onto <html> before the first paint, so a
         returning Arabic visitor never sees an LTR flash. The key and the
         fallback order must match src/i18n/index.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('desa-menu:lang');
          var supported = ['en', 'fr', 'ar', 'es'];
          var lang = supported.indexOf(stored) > -1 ? stored : null;
          if (!lang) {
            var tags = [navigator.language].concat(navigator.languages || []);
            for (var i = 0; i < tags.length && !lang; i++) {
              var base = String(tags[i] || '').toLowerCase().split('-')[0];
              if (supported.indexOf(base) > -1) lang = base;
            }
          }
          lang = lang || 'en';
          var root = document.documentElement;
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          root.setAttribute('data-lang', lang);
        } catch (e) {
          /* storage blocked — the provider resolves it after hydration */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
