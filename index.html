    <!-- Site icons — the official DESA Menu logo: a transparent PNG on the DESA
         CDN, the same file `src/lib/brand.ts` declares as BRAND_LOGO_URL. Keep
         the two in sync if the asset ever moves.

         `icon` + the legacy `shortcut icon` cover Chrome, Edge, Firefox, Safari
         and the in-app browsers that only know the old spelling; both resolve to
         one file, so the "last icon link wins" rule can never surface a
         different mark. `apple-touch-icon` is the iOS home-screen icon. No
         `sizes` attribute on purpose — these are fixed-resolution bitmaps, and
         `sizes="any"` is only valid for scalable (SVG) icons.

         Nothing local is registered as an icon. The previous
         `public/favicon.svg` monogram was declared `alternate icon`, which
         SVG-preferring browsers picked *over* the PNG — that is why the tab kept
         showing the placeholder. `/favicon.ico`, the path browsers probe without
         reading this head, 302s to the same file (vite-plugin-favicon.ts in dev
         and preview, vercel.json on Vercel).

         `npm run icons -- --apply` vendors the whole raster set — favicon.ico,
         apple-touch-icon, maskable/manifest PNGs, a solid-background og:image —
         into public/ and repoints these three links. See README → Site icons. -->
    <link rel="icon" type="image/png" href="https://pub-29827e9bf6264adc912660207eecba67.r2.dev/image.png_20261006110214-removebg-preview.png" />
    <link rel="shortcut icon" type="image/png" href="https://pub-29827e9bf6264adc912660207eecba67.r2.dev/image.png_20261006110214-removebg-preview.png" />

  <body>
    <div id="root"></div>
    <!-- Language bootstrap. Resolves the active locale from localStorage (or the
         browser) and writes lang/dir onto <html> before the first paint, so a
         returning Arabic visitor never sees an LTR flash. The key and the
         fallback order must match src/i18n/index.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('desa-menu:lang');
          var supported = ['en', 'fr', 'ar', 'es'];
          var lang = supported.indexOf(stored) > -1 ? stored : null;
          if (!lang) {
            var tags = [navigator.language].concat(navigator.languages || []);
            for (var i = 0; i < tags.length && !lang; i++) {
              var base = String(tags[i] || '').toLowerCase().split('-')[0];
              if (supported.indexOf(base) > -1) lang = base;
            }
          }
          lang = lang || 'en';
          var root = document.documentElement;
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          root.setAttribute('data-lang', lang);
        } catch (e) {
          /* storage blocked — the provider resolves it after hydration */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
